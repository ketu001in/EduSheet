# Backup for the Vercel cron in apps/web/vercel.json: pings the site's
# keep-alive route so the Supabase free-tier project never sits idle long
# enough to be auto-paused (~7 days), which takes the whole site down.
name: Keep Supabase awake

on:
  schedule:
    - cron: '30 3 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive
        run: |
          curl -fsS --retry 3 --retry-delay 20 -m 60 \
            https://bosket-edstudio-web.vercel.app/api/keep-alive
